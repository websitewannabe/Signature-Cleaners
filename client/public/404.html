
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Signature Cleaners</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to Signature Cleaners homepage.">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #0A1F44; 
            color: white; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 20px;
        }
        .container { max-width: 600px; }
        h1 { font-size: 4rem; color: #F6AE2D; margin-bottom: 1rem; }
        h2 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { margin-bottom: 2rem; opacity: 0.9; line-height: 1.6; }
        .btn { 
            display: inline-block; 
            background: #F6AE2D; 
            color: #0A1F44; 
            padding: 12px 24px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: 600; 
            transition: background 0.3s;
        }
        .btn:hover { background: #e09821; }
        .logo { margin-bottom: 2rem; }
        .logo img { height: 60px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/images/signature-cleaners-logo-white.png" alt="Signature Cleaners" onerror="this.style.display='none'">
        </div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or may have been moved. Let's get you back to our homepage.</p>
        <a href="/" class="btn">Return Home</a>
    </div>
</body>
</html>
